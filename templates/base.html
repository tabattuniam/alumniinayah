<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<meta name="theme-color" content="#064e3b">
<title>{% block title %}Alumni Al-Inayah{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { overflow-x: hidden; font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; color: #0f172a; }
a { text-decoration: none; color: inherit; }
input, select, textarea, button { font-family: inherit; }

.container { max-width: 1100px; margin: 0 auto; padding: 0 16px; }

/* Navbar */
.navbar {
  background: linear-gradient(135deg, #064e3b, #059669);
  padding: 0 20px; height: 58px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 50;
  box-shadow: 0 2px 12px rgba(0,0,0,.15);
}
.navbar-brand { font-size: 16px; font-weight: 900; color: white; display: flex; align-items: center; gap: 8px; }
.navbar-links { display: flex; gap: 6px; }
.navbar-links a {
  color: rgba(255,255,255,.85); font-size: 13px; font-weight: 600;
  padding: 6px 12px; border-radius: 8px; transition: all .15s;
}
.navbar-links a:hover, .navbar-links a.active { background: rgba(255,255,255,.15); color: white; }

/* Footer */
footer { background: #0f172a; color: #64748b; text-align: center; padding: 24px 16px; font-size: 12px; margin-top: 60px; }

/* Cards */
.card { background: white; border-radius: 16px; box-shadow: 0 1px 8px rgba(0,0,0,.07); overflow: hidden; }

/* Alerts */
.alert-ok  { background:#f0fdf4; border:1.5px solid #bbf7d0; border-radius:12px; padding:12px 16px; font-size:13px; color:#16a34a; font-weight:600; margin-bottom:16px; }
.alert-err { background:#fef2f2; border:1.5px solid #fca5a5; border-radius:12px; padding:12px 16px; font-size:13px; color:#dc2626; font-weight:600; margin-bottom:16px; }

/* Badges */
.badge { padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; display: inline-block; }
.badge-l { background: #dbeafe; color: #1e40af; }
.badge-p { background: #fce7f3; color: #9d174d; }

/* Form */
.form-group { margin-bottom: 14px; }
.form-label { font-size: 12px; font-weight: 700; color: #475569; display: block; margin-bottom: 5px; }
.form-input, .form-select, .form-textarea {
  width: 100%; padding: 10px 12px; border: 1.5px solid #e2e8f0;
  border-radius: 10px; font-size: 13px; background: white; transition: all .15s;
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
  outline: none; border-color: #059669; box-shadow: 0 0 0 3px rgba(5,150,105,.1);
}
.form-textarea { resize: vertical; min-height: 80px; }
.form-section { font-size: 11px; font-weight: 800; color: #059669; text-transform: uppercase; letter-spacing: .6px; margin: 22px 0 12px; padding-bottom: 6px; border-bottom: 2px solid #f0fdf4; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 18px; border-radius: 10px; font-size: 13px; font-weight: 700; border: none; cursor: pointer; transition: all .15s; }
.btn-primary { background: linear-gradient(135deg,#059669,#10b981); color: white; }
.btn-primary:hover { box-shadow: 0 4px 16px rgba(5,150,105,.35); transform: translateY(-1px); }
.btn-ghost { background: white; color: #475569; border: 1.5px solid #e2e8f0; }
.btn-ghost:hover { background: #f8fafc; }
.btn-danger { background: #fef2f2; color: #dc2626; border: 1.5px solid #fca5a5; }
.btn-sm { padding: 6px 12px; font-size: 12px; }
</style>
{% block extra_css %}{% endblock %}
</head>
<body>
<nav class="navbar">
  <a class="navbar-brand" href="/">
    <span style="font-size:22px;">🕌</span>
    Alumni Al-Inayah
  </a>
  <div class="navbar-links">
    <a href="/" {% if request.url.path == '/' %}class="active"{% endif %}>Beranda</a>
    <a href="/direktori" {% if '/direktori' in request.url.path %}class="active"{% endif %}>Direktori</a>
    <a href="/statistik" {% if '/statistik' in request.url.path %}class="active"{% endif %}>Statistik</a>
    <a href="/daftar" {% if '/daftar' in request.url.path %}class="active"{% endif %} style="background:rgba(255,255,255,.2);">+ Daftar</a>
  </div>
</nav>

{% block body %}{% endblock %}

<footer>
  <div>🕌 Alumni Pondok Pesantren Al-Inayah</div>
  <div style="margin-top:4px;">© {{ now.year if now else 2026 }}</div>
</footer>
{% block extra_js %}{% endblock %}
</body>
</html>
